<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0a7aff" />
    <title>Tribe Phone — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", "Segoe UI", sans-serif;
        background: #f6f6f8;
        color: #1d1d1f;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        box-sizing: border-box;
      }
      main {
        width: min(100%, 360px);
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        display: block;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: #626268;
        font-size: 16px;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        padding: 0 22px;
        background: #0a7aff;
        color: white;
        font: inherit;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #1e1e20;
          color: #f5f5f7;
        }
        p {
          color: #a8a8ae;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="icon"
        src="/icons/icon-192.png"
        alt=""
        width="72"
        height="72"
      />
      <h1>You’re offline</h1>
      <p>Reconnect to place calls, receive messages, and refresh conversations.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
